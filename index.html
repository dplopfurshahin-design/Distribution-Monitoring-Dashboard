<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distribution Monitoring Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
*{font-family:Arial,Helvetica,sans-serif!important;box-sizing:border-box}
body{margin:0;background:#f2f4f8;color:#1d2433;font-size:13px}
header{background:#14284b;color:#fff;padding:14px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{margin:0;font-size:22px}
.sub{font-size:11px;opacity:.8;margin-top:3px}
.btn{background:#2f80ed;color:#fff;border:0;padding:9px 16px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:bold}
.btn.g{background:#27ae60}.btn:hover{filter:brightness(1.1)}
.filters{position:sticky;top:0;z-index:5;background:#fff;padding:10px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;box-shadow:0 1px 4px #0002}
.filters label{display:block;font-size:11px;font-weight:bold;color:#55627a;margin-bottom:3px;text-transform:uppercase}
select,input[type=number]{width:100%;padding:7px;border:1px solid #c5cde0;border-radius:5px;font-size:13px;background:#fff}
main{padding:16px 22px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px #0001;min-width:0}
.card.w{grid-column:1/-1}
.card h2{margin:0 0 3px;font-size:15px;color:#14284b}
.note{font-size:11px;color:#6b778c;margin-bottom:8px}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:#fff;border-radius:8px;padding:12px 14px;border-left:5px solid #2f80ed;box-shadow:0 1px 3px #0001}
.kpi b{display:block;font-size:21px;margin-top:4px}.kpi span{font-size:11px;color:#6b778c;text-transform:uppercase}
.ch{position:relative;height:420px}.ch.s{height:320px}.ch.t{height:560px}
.tw{max-height:300px;overflow:auto;margin-top:10px;border:1px solid #e4e8f0}
table{border-collapse:collapse;width:100%}th,td{padding:5px 8px;text-align:right;border-bottom:1px solid #eef0f5;white-space:nowrap}
th{position:sticky;top:0;background:#eef2fa;font-size:11px}td:first-child,th:first-child,td.l,th.l{text-align:left}
.neg{color:#c0392b;font-weight:bold}.pos{color:#1e8449;font-weight:bold}.flag{background:#fdecea}
#toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14284b;color:#fff;padding:10px 16px;border-radius:6px;max-width:92%;z-index:20;box-shadow:0 2px 10px #0004;font-size:12px}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.sw input{display:none}.sw i{width:30px;height:16px;background:#b8c2d6;border-radius:9px;position:relative;transition:.2s;display:inline-block}.sw i:after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:#27ae60}.sw input:checked+i:after{left:16px}.sw.dis{opacity:.45;cursor:not-allowed}.hl{background:#e9f7ef}
.pill{padding:2px 7px;border-radius:9px;font-size:11px;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}main,.two{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style></head><body>
